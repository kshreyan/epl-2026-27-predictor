- market_id: india_digital_assets
  display_name: India Digital Assets
  country: India
  asset_class: digital_assets
  currency: INR
  # Same CoinGecko source/coin universe as us_digital_assets, quoted in
  # INR directly (CoinGecko's own real `vs_currency=inr` support) --
  # crypto itself is a global market, not India-specific pricing.
  # Real regulatory context (confirmed via research, not assumed):
  # India has kept a flat 30% tax on virtual digital asset gains plus
  # 1% TDS on transaction value since 2022, unchanged through the real
  # 2026 budget; no comprehensive crypto law/regulator exists yet.
  # Disclosed in the site's own UI copy, not just here.
  source: coingecko
  tickers: [bitcoin, ethereum, solana, cardano, ripple, dogecoin]

- market_id: india_real_assets
  display_name: India Real Assets
  country: India
  asset_class: real_assets
  currency: INR
