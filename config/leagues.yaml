# Registry of every competition this pipeline predicts. `epl` is the
# original, already-live league and MUST keep its exact current file
# paths (league_id "epl" maps to the literal epl_2026_27_* names
# already in the repo) -- zero migration for already-live data.
#
# Every field here was verified against the real, live source before
# being added (see reports/epl_2026_27_model_report.md and the session
# that added multi-league support): football-data.co.uk for
# football_data_code, fixturedownload.com for fixturedownload_slug, The
# Odds API's /v4/sports/ endpoint for odds_api_sport_key.
#
# UEFA Champions League (added 2026-10-19): `format: swiss` -- a single
# 36-team table with a REAL PARTIAL schedule (each team plays 8 of the
# other 35, not a full round-robin), so no expected-table/races/
# season-simulation dashboard is built for it (see
# single_table_league_ids()). The knockout bracket that follows the
# league phase is explicitly OUT OF SCOPE -- it isn't drawn until the
# league phase ends, fixturedownload's current-season feed doesn't
# include it, and this pipeline has no two-legged-tie/bracket
# simulation. Match predictions and (only where its own real backtest
# supports it -- see reports/ucl_model_selection_report.md) +2 Margin
# Survival cover the 144 real league-phase matches only.
#
# Removed leagues (re-adding any of them needs its own collectors and
# daily-refresh wiring, not just a config entry):
# - UEFA Europa League, NFL, NBA, NCAA Football and NCAA Basketball were
#   removed in full on 2026-11-26 at the user's request, leaving the five
#   big European domestic leagues plus the Champions League.
# - UEFA Conference League and Nations League: removed 2026-11-14 (too
#   little real history on the only source).
# - MLS: removed after a prediction-health audit found its results
#   weren't being kept current by the daily automation.
# - NHL and UFC: removed 2026-10-29 / 2026-10-26.
leagues:
  - league_id: epl
    display_name: Premier League
    country: England
    football_data_code: E0
    fixturedownload_slug: epl
    odds_api_sport_key: soccer_epl
    timezone: Europe/London
    n_teams: 20
    match_id_prefix: EPL

  - league_id: la_liga
    display_name: La Liga
    country: Spain
    football_data_code: SP1
    fixturedownload_slug: la-liga
    odds_api_sport_key: soccer_spain_la_liga
    timezone: Europe/Madrid
    n_teams: 20
    match_id_prefix: LALIGA

  - league_id: serie_a
    display_name: Serie A
    country: Italy
    football_data_code: I1
    fixturedownload_slug: serie-a
    odds_api_sport_key: soccer_italy_serie_a
    timezone: Europe/Rome
    n_teams: 20
    match_id_prefix: SERIEA

  - league_id: bundesliga
    display_name: Bundesliga
    country: Germany
    football_data_code: D1
    fixturedownload_slug: bundesliga
    odds_api_sport_key: soccer_germany_bundesliga
    timezone: Europe/Berlin
    n_teams: 18
    match_id_prefix: BUNDESLIGA

  - league_id: ligue_1
    display_name: Ligue 1
    country: France
    football_data_code: F1
    fixturedownload_slug: ligue-1
    odds_api_sport_key: soccer_france_ligue_one
    timezone: Europe/Paris
    n_teams: 18
    match_id_prefix: LIGUE1

  - league_id: ucl
    display_name: UEFA Champions League
    country: Europe
    fixturedownload_slug: champions-league
    odds_api_sport_key: soccer_uefa_champs_league
    timezone: UTC
    n_teams: 36
    match_id_prefix: UCL
    format: swiss
    expected_fixture_count: 144
