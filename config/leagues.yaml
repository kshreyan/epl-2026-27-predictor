# Registry of every competition this pipeline predicts. `epl` is the
# original, already-live league and MUST keep its exact current file
# paths (league_id "epl" maps to the literal epl_2026_27_* names
# already in the repo) -- zero migration for already-live data.
#
# Every field here was verified against the real, live source before
# being added (see reports/epl_2026_27_model_report.md and the session
# that added multi-league support): football-data.co.uk for
# football_data_code, fixturedownload.com for fixturedownload_slug, The
# Odds API's /v4/sports/ endpoint for odds_api_sport_key.
#
# UEFA Champions League / Europa League are still deliberately NOT
# listed here as of 2026-09-21 -- not for lack of a real data source
# (fixturedownload.com has real historical+current fixtures for both
# back to 2017, and The Odds API has soccer_uefa_champs_league/
# soccer_uefa_europa_league sport keys, confirmed directly against
# /v4/sports/) -- but because they are a partial league phase (each of
# 36 teams plays only 8 of the other 35) plus a knockout bracket, and
# no format value here models a bracket yet. `format: groups` (added
# for UEFA Nations League below) may fit the league-phase stage once
# someone decides how to handle the knockout bracket. Still explicitly
# deferred, not silently dropped.
#
# MLS (added below) really is two conferences plus a playoff bracket,
# same real mismatch -- but per the request to present it "in the same
# format as EPL," treated as `format: single_table`, one combined
# 30-team table across both conferences (real conference standings and
# the playoff bracket are not separately modeled), the same shape as
# every European league here.
# relegation_zone_size: 0 because MLS has no real relegation (0% for
# every team is a true statement, not an omission -- see
# LeagueConfig.relegation_zone_size). playoff_zone_size: 16
# approximates the real cutoff (16 of 30 teams make the real playoffs)
# but does NOT reproduce actual qualification, which is separately
# top-8-per-conference -- a team could be top 16 overall and miss out
# by finishing outside its own conference's top 8, or the reverse.
leagues:
  - league_id: epl
    display_name: Premier League
    country: England
    football_data_code: E0
    fixturedownload_slug: epl
    odds_api_sport_key: soccer_epl
    timezone: Europe/London
    n_teams: 20
    match_id_prefix: EPL

  - league_id: la_liga
    display_name: La Liga
    country: Spain
    football_data_code: SP1
    fixturedownload_slug: la-liga
    odds_api_sport_key: soccer_spain_la_liga
    timezone: Europe/Madrid
    n_teams: 20
    match_id_prefix: LALIGA

  - league_id: serie_a
    display_name: Serie A
    country: Italy
    football_data_code: I1
    fixturedownload_slug: serie-a
    odds_api_sport_key: soccer_italy_serie_a
    timezone: Europe/Rome
    n_teams: 20
    match_id_prefix: SERIEA

  - league_id: bundesliga
    display_name: Bundesliga
    country: Germany
    football_data_code: D1
    fixturedownload_slug: bundesliga
    odds_api_sport_key: soccer_germany_bundesliga
    timezone: Europe/Berlin
    n_teams: 18
    match_id_prefix: BUNDESLIGA

  - league_id: ligue_1
    display_name: Ligue 1
    country: France
    football_data_code: F1
    fixturedownload_slug: ligue-1
    odds_api_sport_key: soccer_france_ligue_one
    timezone: Europe/Paris
    n_teams: 18
    match_id_prefix: LIGUE1

  # Real fixtures+historical results: fixturedownload.com's
  # nations-league-2026 (2026-27 cycle, 156 matches, 54 UEFA members)
  # and nations-league-2024 (2024-25 cycle, 167 real scored matches --
  # the only prior cycle that source has). No football-data.co.uk
  # coverage exists for this competition (football_data_code is
  # intentionally None) -- a bespoke collector supplies real historical
  # data instead of the shared football-data.co.uk-based one. format:
  # groups because League A/B/C/D each split into groups of 3-4 teams
  # with no combined table -- excluded from single_table_league_ids()
  # and everything keyed off it (table/races/season-simulation
  # dashboards, the domestic Trusted Picks pool). See
  # src/international/ for its own, separately-built pipeline and
  # dashboard/trusted-picks output.
  - league_id: nations_league
    display_name: UEFA Nations League
    country: Europe
    fixturedownload_slug: nations-league
    odds_api_sport_key: soccer_uefa_nations_league
    timezone: UTC
    n_teams: 54
    match_id_prefix: UNL
    format: groups

  # Real fixtures+historical results: fixturedownload.com's mls-2026
  # (current season, 510 matches, 30 teams, real scores for matches
  # already played as of 2026-09-21) plus mls-2023/2024/2025 (1,496
  # more real completed matches -- three full prior seasons, close to
  # domestic-league backtest sample size, unlike UEFA Nations League's
  # thin one-cycle history). No football-data.co.uk coverage exists
  # for MLS (football_data_code is intentionally None) -- a bespoke
  # collector supplies real historical data instead of the shared
  # football-data.co.uk-based one; season is a single real calendar
  # year (MLS runs Feb-Dec), not the "2026-27" split-year label every
  # European league here uses, but file paths still use the literal
  # "2026_27" suffix for compatibility with the shared pipeline (see
  # league_path()) -- a filename convention only, not a data error.
  - league_id: mls
    display_name: MLS
    country: United States/Canada
    fixturedownload_slug: mls
    odds_api_sport_key: soccer_usa_mls
    timezone: America/New_York
    n_teams: 30
    match_id_prefix: MLS
    format: single_table
    relegation_zone_size: 0
    playoff_zone_size: 16
