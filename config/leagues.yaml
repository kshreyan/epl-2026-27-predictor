# Registry of every competition this pipeline predicts. `epl` is the
# original, already-live league and MUST keep its exact current file
# paths (league_id "epl" maps to the literal epl_2026_27_* names
# already in the repo) -- zero migration for already-live data.
#
# Every field here was verified against the real, live source before
# being added (see reports/epl_2026_27_model_report.md and the session
# that added multi-league support): football-data.co.uk for
# football_data_code, fixturedownload.com for fixturedownload_slug, The
# Odds API's /v4/sports/ endpoint for odds_api_sport_key.
#
# UEFA Champions League / Europa League are still deliberately NOT
# listed here as of 2026-09-21 -- not for lack of a real data source
# (fixturedownload.com has real historical+current fixtures for both
# back to 2017, and The Odds API has soccer_uefa_champs_league/
# soccer_uefa_europa_league sport keys, confirmed directly against
# /v4/sports/) -- but because they are a partial league phase (each of
# 36 teams plays only 8 of the other 35) plus a knockout bracket, and
# no format value here models a bracket yet. Still explicitly deferred,
# not silently dropped.
#
# MLS and UEFA Nations League were previously supported here (bespoke
# collectors/Elo-only models, `format: groups`/`single_table` with a
# playoff_zone_size override) and were removed, along with their site
# pages and dashboard JSON, after a prediction-health audit found their
# results weren't being kept current by the daily automation (see
# reports/epl_2026_27_prediction_health_report.md) -- re-adding either
# needs its own data-collection/weekly-refresh wiring, not just a
# config entry.
leagues:
  - league_id: epl
    display_name: Premier League
    country: England
    football_data_code: E0
    fixturedownload_slug: epl
    odds_api_sport_key: soccer_epl
    timezone: Europe/London
    n_teams: 20
    match_id_prefix: EPL

  - league_id: la_liga
    display_name: La Liga
    country: Spain
    football_data_code: SP1
    fixturedownload_slug: la-liga
    odds_api_sport_key: soccer_spain_la_liga
    timezone: Europe/Madrid
    n_teams: 20
    match_id_prefix: LALIGA

  - league_id: serie_a
    display_name: Serie A
    country: Italy
    football_data_code: I1
    fixturedownload_slug: serie-a
    odds_api_sport_key: soccer_italy_serie_a
    timezone: Europe/Rome
    n_teams: 20
    match_id_prefix: SERIEA

  - league_id: bundesliga
    display_name: Bundesliga
    country: Germany
    football_data_code: D1
    fixturedownload_slug: bundesliga
    odds_api_sport_key: soccer_germany_bundesliga
    timezone: Europe/Berlin
    n_teams: 18
    match_id_prefix: BUNDESLIGA

  - league_id: ligue_1
    display_name: Ligue 1
    country: France
    football_data_code: F1
    fixturedownload_slug: ligue-1
    odds_api_sport_key: soccer_france_ligue_one
    timezone: Europe/Paris
    n_teams: 18
    match_id_prefix: LIGUE1
