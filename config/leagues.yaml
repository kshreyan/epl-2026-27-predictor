# Registry of every competition this pipeline predicts. `epl` is the
# original, already-live league and MUST keep its exact current file
# paths (league_id "epl" maps to the literal epl_2026_27_* names
# already in the repo) -- zero migration for already-live data.
#
# Every field here was verified against the real, live source before
# being added (see reports/epl_2026_27_model_report.md and the session
# that added multi-league support): football-data.co.uk for
# football_data_code, fixturedownload.com for fixturedownload_slug, The
# Odds API's /v4/sports/ endpoint for odds_api_sport_key.
#
# UEFA Champions League, Europa League, and Conference League (added
# 2026-10-19): `format: swiss` -- a single 36-team table with a REAL
# PARTIAL schedule (each team plays 8 (UCL/UEL) or 6 (UECL) of the
# other 35, not a full round-robin), so no expected-table/races/
# season-simulation dashboard is built for them (see
# single_table_league_ids()). The knockout bracket that follows the
# league phase (playoff round -> Round of 16 -> Final) is explicitly
# OUT OF SCOPE -- it isn't drawn until the league phase ends, fixture
# download's current-season feed doesn't include it, and this pipeline
# has no two-legged-tie/bracket simulation. Match predictions and (only
# where each competition's own real backtest supports it -- see
# reports/{league}_model_selection_report.md) +2 Margin Survival cover
# the 144/144/108 real league-phase matches only.
#
# NFL and NBA (added 2026-10-21): `format: points` -- real American
# team sports, scored in points not goals. No fixturedownload_slug/
# football_data_code (neither source covers these) -- fixtures AND
# historical results both come from ESPN's public site API
# (site.api.espn.com), confirmed directly accessible, via
# collect_espn_schedule.py/collect_espn_historical.py, not
# collect_fixtures.py. The Dixon-Coles/Poisson scoreline grid
# (scoreline_models.py) does not fit these sports' scoring scale
# (10-40+ points for NFL, 90-130+ for NBA, vs soccer's 0-8 goals) --
# predictions use src/models/point_margin_model.py (Elo + a real
# fitted margin-of-victory regression) instead. Real divisions/
# conferences are hardcoded in simulate_team_sport_season.py (stable
# public facts, unchanged in years -- same discipline as hardcoding a
# real club roster in team_names.py), not derived from an API.
#
# NHL and NCAA Football (added 2026-10-24): `format: points`, the
# exact same real American-team-sport pattern as NFL/NBA above --
# fixtures/historical results from ESPN's site API
# (collect_espn_schedule.py/collect_espn_historical.py), predictions
# from src/models/point_margin_model.py. NHL's real scoring is low and
# discrete like soccer's, so its own real backtest (unlike NFL/NBA's)
# also tries Dixon-Coles as a candidate -- see
# reports/nhl_model_selection_report.md for which one actually won.
# NCAA Football's real FBS conference groupings (134 teams, 11
# conferences) are fetched live from ESPN's own standings endpoint at
# build time, not hardcoded, since conference realignment is a real
# recurring event in college sports (unlike NFL/NBA's stable
# divisions) -- see src/data_collection/espn_api.py's
# fetch_real_fbs_conferences(). NCAA Football has no real playoff-
# seeding FORMULA (the 12-team CFP is committee-selected, not
# standings math) -- its season simulation reports real conference
# win-loss projections and bowl-eligibility probability
# (P(finish 6+ wins)) instead of a fabricated seeding claim.
#
# UFC (added 2026-10-24): `format: fight_card` -- not a team sport, a
# genuinely different real structure (individual fighters, no
# schedule/table). n_teams is 0 (no real meaning for this format).
# Real fixtures/historical fight results come from ESPN's MMA API
# (src/data_collection/espn_mma_api.py), grouped by real EVENT (fight
# card), not matchweek. No continuous score margin exists for a single
# fight, so +2 Margin Survival's real equivalent here is "Distance
# Survival" -- P(fighter is finished by KO/TKO/submission) vs. P(fight
# reaches a real judges' decision) -- see
# src/models/fight_distance_model.py and
# src/models/compute_margin_survival_ufc.py.
#
# MLS and UEFA Nations League were previously supported here (bespoke
# collectors/Elo-only models, `format: groups`/`single_table` with a
# playoff_zone_size override) and were removed, along with their site
# pages and dashboard JSON, after a prediction-health audit found their
# results weren't being kept current by the daily automation (see
# reports/epl_2026_27_prediction_health_report.md) -- re-adding either
# needs its own data-collection/weekly-refresh wiring, not just a
# config entry.
leagues:
  - league_id: epl
    display_name: Premier League
    country: England
    football_data_code: E0
    fixturedownload_slug: epl
    odds_api_sport_key: soccer_epl
    timezone: Europe/London
    n_teams: 20
    match_id_prefix: EPL

  - league_id: la_liga
    display_name: La Liga
    country: Spain
    football_data_code: SP1
    fixturedownload_slug: la-liga
    odds_api_sport_key: soccer_spain_la_liga
    timezone: Europe/Madrid
    n_teams: 20
    match_id_prefix: LALIGA

  - league_id: serie_a
    display_name: Serie A
    country: Italy
    football_data_code: I1
    fixturedownload_slug: serie-a
    odds_api_sport_key: soccer_italy_serie_a
    timezone: Europe/Rome
    n_teams: 20
    match_id_prefix: SERIEA

  - league_id: bundesliga
    display_name: Bundesliga
    country: Germany
    football_data_code: D1
    fixturedownload_slug: bundesliga
    odds_api_sport_key: soccer_germany_bundesliga
    timezone: Europe/Berlin
    n_teams: 18
    match_id_prefix: BUNDESLIGA

  - league_id: ligue_1
    display_name: Ligue 1
    country: France
    football_data_code: F1
    fixturedownload_slug: ligue-1
    odds_api_sport_key: soccer_france_ligue_one
    timezone: Europe/Paris
    n_teams: 18
    match_id_prefix: LIGUE1

  - league_id: ucl
    display_name: UEFA Champions League
    country: Europe
    fixturedownload_slug: champions-league
    odds_api_sport_key: soccer_uefa_champs_league
    timezone: UTC
    n_teams: 36
    match_id_prefix: UCL
    format: swiss
    expected_fixture_count: 144

  - league_id: uel
    display_name: UEFA Europa League
    country: Europe
    fixturedownload_slug: europa-league
    odds_api_sport_key: soccer_uefa_europa_league
    timezone: UTC
    n_teams: 36
    match_id_prefix: UEL
    format: swiss
    expected_fixture_count: 144

  - league_id: uecl
    display_name: UEFA Conference League
    country: Europe
    fixturedownload_slug: conference-league
    odds_api_sport_key: soccer_uefa_europa_conference_league
    timezone: UTC
    n_teams: 36
    match_id_prefix: UECL
    format: swiss
    expected_fixture_count: 108

  - league_id: nfl
    display_name: NFL
    country: United States
    odds_api_sport_key: americanfootball_nfl
    timezone: America/New_York
    n_teams: 32
    match_id_prefix: NFL
    format: points

  - league_id: nba
    display_name: NBA
    country: United States
    odds_api_sport_key: basketball_nba
    timezone: America/New_York
    n_teams: 30
    match_id_prefix: NBA
    format: points

  - league_id: nhl
    display_name: NHL
    country: United States
    odds_api_sport_key: icehockey_nhl
    timezone: America/New_York
    n_teams: 32
    match_id_prefix: NHL
    format: points

  - league_id: ncaaf
    display_name: NCAA Football
    country: United States
    odds_api_sport_key: americanfootball_ncaaf
    timezone: America/New_York
    # Real, live FBS team count confirmed via ESPN's own standings feed
    # this session (138, not the often-cited round "134" -- real
    # transitioning programs shift this slightly season to season).
    # collect_espn_schedule.py sanity-checks against a wide band, not
    # exact equality, since this roster genuinely isn't fixed the way
    # NFL/NBA/NHL's is -- see espn_api.py's fetch_real_season_games().
    n_teams: 138
    match_id_prefix: NCAAF
    format: points

  - league_id: ufc
    display_name: UFC
    country: United States
    odds_api_sport_key: mma_mixed_martial_arts
    timezone: America/New_York
    n_teams: 0
    match_id_prefix: UFC
    format: fight_card
