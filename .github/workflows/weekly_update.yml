name: Weekly auto-update after each gameweek

# Closes the loop the deploy workflow deliberately doesn't: fetches
# real, completed 2026-27 results (football-data.co.uk's live-updating
# current-season file), locks any gameweek that has now FULLY
# concluded, refits, re-predicts the rest of the season (including next
# gameweek), scores what just happened, and lets the gated
# recalibration process (150-match minimum, rolling-origin, paired-
# bootstrap 95% CI, every-5th-matchweek cadence -- see
# recalibration_gate.py) evaluate itself. See src/weekly_auto_update.py
# for the real logic; this workflow just runs it on a schedule.
#
# Safe to run daily: src/weekly_auto_update.py is a genuine no-op (no
# lock, no refit, no commit) on any day where no gameweek has newly and
# fully concluded since the last run. A push here (only happens when
# something actually changed) triggers deploy.yml, which redeploys the
# dashboard from whatever this workflow just committed.
#
# Also refreshes live match odds every run (ODDS_API_KEY repo secret,
# 1 credit/call, well under the free tier's 500/month at daily cadence)
# -- this keeps data/raw/epl_2026_27_real_odds.csv current even on days
# nothing else changes, so the scoring baseline in
# reports/epl_2026_27_model_report.md "Market comparison" doesn't go
# stale the way it would if odds were only ever fetched manually.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC -- safe because most days are a no-op
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false # never cancel a run mid-way through locking a matchweek

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast test suite (safety check before touching real data)
        run: python -m pytest tests/ -q -m "not slow"

      - name: Refresh live match odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.data_collection.collect_odds

      - name: Run weekly auto-update
        run: python -m src.weekly_auto_update

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes -- nothing to commit."
          else
            git commit -m "Automated weekly update: lock concluded gameweek, re-predict, re-score"
            git push
          fi
