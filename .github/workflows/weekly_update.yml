name: Weekly auto-update after each gameweek

# Closes the loop the deploy workflow deliberately doesn't: fetches
# real, completed 2026-27 results (football-data.co.uk's live-updating
# current-season file), locks any gameweek that has now FULLY
# concluded, refits, re-predicts the rest of the season (including next
# gameweek), scores what just happened, and lets the gated
# recalibration process (150-match minimum, rolling-origin, paired-
# bootstrap 95% CI, every-5th-matchweek cadence -- see
# recalibration_gate.py) evaluate itself. See src/weekly_auto_update.py
# for the real logic; this workflow just runs it on a schedule.
#
# Safe to run daily: src/weekly_auto_update.py is a genuine no-op (no
# lock, no refit, no commit) on any day where no gameweek has newly and
# fully concluded since the last run.
#
# IMPORTANT: a push made with the default GITHUB_TOKEN does NOT trigger
# other on:push workflows (a deliberate GitHub anti-recursion rule) --
# confirmed the hard way: the first real run of this workflow committed
# and pushed successfully but deploy.yml never fired. So this workflow
# explicitly dispatches deploy.yml itself as its last step whenever it
# committed something, rather than relying on the push trigger to do it.
#
# Also refreshes live match odds (ODDS_API_KEY repo secret) -- but only
# once a week per league, ahead of its matches: the 5 domestic leagues
# on Fridays (UTC, before the weekend), the Champions League on Mondays
# (UTC, before its Tuesday/Wednesday matchdays). A refresh of all 6
# leagues costs ~54 credits, so a daily refresh (~1,600/month) blows
# through the free tier's 500/month, while weekly (~240/month) fits.
# Every other day reuses each league's last real odds on disk. A
# manual run can force a refresh of all 6 with the "refresh_odds" input.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC -- safe because most days are a no-op
  workflow_dispatch:
    inputs:
      refresh_odds:
        description: "Refresh odds for all 6 leagues regardless of weekday (uses ~54 Odds API credits)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # needed to dispatch deploy.yml explicitly (see note above)

concurrency:
  group: weekly-update
  cancel-in-progress: false # never cancel a run mid-way through locking a matchweek

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history, all tags) -- NOT the actions/checkout
      # default (a shallow, depth-1 clone). score_after_matchweek's
      # preseason track reads the "preseason-2026-27-v2" tag via
      # `git show <tag>:<path>` (prediction_ledger.load_preseason_ledger);
      # that tag's commit isn't present in a shallow clone, so this
      # failed with a real "fatal: invalid object name" the first time
      # this workflow ever reached a real matchweek lock.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast test suite (safety check before touching real data)
        run: python -m pytest tests/ -q -m "not slow"

      # One iteration per active league (config/leagues.yaml) -- adding a
      # new league there needs no workflow change, just adding its id to
      # this list. "epl" alone reproduces exactly what this step always did.
      # Domestic leagues on Fridays, UCL on Mondays (see the note at the
      # top) -- GitHub often starts the 06:00 UTC schedule hours late, but
      # never late enough to slip into the next day, so the UTC weekday
      # of the actual run is what gates this.
      - name: Pick which leagues' odds to refresh today
        id: odds_day
        run: |
          weekday="$(date -u +%u)"  # 1 = Monday ... 5 = Friday
          if [ "${{ inputs.refresh_odds }}" = "true" ]; then
            leagues="epl la_liga serie_a bundesliga ligue_1 ucl"
          elif [ "$weekday" = "5" ]; then
            leagues="epl la_liga serie_a bundesliga ligue_1"
          elif [ "$weekday" = "1" ]; then
            leagues="ucl"
          else
            leagues=""
            echo "Not Friday or Monday (UTC) -- keeping every league's last real odds on disk."
          fi
          echo "leagues=$leagues" >> "$GITHUB_OUTPUT"

      - name: Refresh live match odds
        if: steps.odds_day.outputs.leagues != ''
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # A league whose refresh fails is isolated, not fatal: collect_odds
        # exits non-zero when The Odds API call fails (bad or
        # deactivated key, exhausted monthly credits) and leaves that
        # league's last real odds file untouched; record it and carry on
        # (model-only predictions are a supported mode), failing the job
        # at the end so a dead key can't go unnoticed again.
        run: |
          failed=""
          for league in ${{ steps.odds_day.outputs.leagues }}; do
            python -m src.data_collection.collect_odds --league "$league" || failed="$failed odds:$league"
          done
          if [ -n "$failed" ]; then
            echo "::error::Odds refresh failed for:$failed -- kept each league's previous real odds"
            echo "REFRESH_FAILURES=$failed" >> "$GITHUB_ENV"
          fi

      - name: Run weekly auto-update
        run: |
          for league in epl la_liga serie_a bundesliga ligue_1; do
            python -m src.weekly_auto_update --league "$league"
          done

      # UCL (see predict_continental_cup_matches.py): no matchweek-lock/
      # refit mechanism exists for it yet (unlike weekly_auto_update.py
      # above) -- every run re-fetches whatever real league-phase results
      # fixturedownload.com has and recomputes fresh. A genuine no-op on
      # content on a day no real result changed. UEL removed 2026-11-26,
      # UECL and Nations League 2026-11-14.
      - name: Refresh UEFA Champions League predictions
        run: |
          python -m src.data_collection.fetch_continental_cup_live_results --league ucl
          python -m src.models.predict_continental_cup_matches --league ucl
          python -m src.models.compute_margin_survival_continental --league ucl

      - name: Rebuild dashboard JSON
        run: python -m src.dashboard.build_dashboard_json

      # +2 Margin Survival Engine (Phase 1, domestic leagues -- see
      # compute_margin_survival.py's module docstring -- plus UCL,
      # recomputed just above). Run daily like the odds refresh
      # above, not gated on a matchweek lock: this uses whatever
      # predictions are currently published, and its "recent real
      # matches" historical-tail window is date-based, so it can shift
      # day to day even without a new lock.
      - name: Recompute +2 margin survival engine
        run: |
          python -m src.models.compute_margin_survival
          python -m src.dashboard.build_margin_survival_json

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes -- nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated weekly update: lock concluded gameweek, re-predict, re-score"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger dashboard deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml

      - name: Fail if any league's data refresh failed
        if: env.REFRESH_FAILURES != ''
        run: |
          echo "::error::Every other league was updated and committed, but these kept stale data:${REFRESH_FAILURES}"
          exit 1
