name: Deploy dashboard to GitHub Pages

# Builds and deploys site/ from whatever data/outputs/dashboard/*.json is
# already committed on main. This does NOT re-run the prediction pipeline
# -- that stays a separate, deliberately not-yet-built scheduled workflow
# (see reports/epl_2026_27_model_report.md), so a push here can never
# silently publish a pipeline run nobody reviewed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build (syncs data/outputs/dashboard/*.json via prebuild)
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
